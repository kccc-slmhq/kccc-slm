<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d1b69"/>
      <stop offset="100%" style="stop-color:#0f0830"/>
    </linearGradient>
    <linearGradient id="cross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c4b5fd"/>
      <stop offset="100%" style="stop-color:#4dd9ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Glow behind cross -->
  <ellipse cx="256" cy="230" rx="100" ry="130" fill="#7c5cfc" opacity="0.25" filter="url(#glow)"/>
  <!-- Cross vertical bar -->
  <rect x="224" y="96" width="64" height="260" rx="32" fill="url(#cross)"/>
  <!-- Cross horizontal bar -->
  <rect x="144" y="176" width="224" height="64" rx="32" fill="url(#cross)"/>
  <!-- Bottom dot accent -->
  <circle cx="256" cy="410" r="18" fill="#4dd9ff" opacity="0.7"/>
</svg>
