<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0f3a"/>
      <stop offset="100%" style="stop-color:#0f0830"/>
    </linearGradient>
    <linearGradient id="cross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#4dd9ff"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c5cfc;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#4dd9ff;stop-opacity:0.1"/>
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Subtle glow circle -->
  <circle cx="256" cy="220" r="180" fill="url(#glow)"/>
  <!-- Cross vertical -->
  <rect x="228" y="100" width="56" height="220" rx="28" fill="url(#cross)"/>
  <!-- Cross horizontal -->
  <rect x="148" y="180" width="216" height="56" rx="28" fill="url(#cross)"/>
  <!-- Bottom text area: SLM -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-weight="900" font-size="80" fill="white" text-anchor="middle" letter-spacing="8" opacity="0.9">SLM</text>
</svg>
