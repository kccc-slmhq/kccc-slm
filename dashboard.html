<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KCCC PRS 참여 현황 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root {
    --card: #ffffff;
    --accent: #3b5bdb;
    --accent2: #f59f00;
    --accent3: #20c997;
    --text: #1b1f29;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: linear-gradient(160deg, #0f1626 0%, #1b2942 100%);
    color: var(--text);
    padding: 16px;
  }
  h1 {
    color: #fff;
    font-size: 22px;
    margin: 0 0 4px;
  }
  .subtitle {
    color: #b9c2d6;
    font-size: 13px;
    margin-bottom: 18px;
  }
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 18px;
  }
  .kpi {
    background: var(--card);
    border-radius: 14px;
    padding: 16px 18px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.18);
  }
  .kpi .label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .kpi .value { font-size: 24px; font-weight: 700; color: var(--accent); }
  .kpi .value.green { color: var(--accent3); }
  .kpi .value.orange { color: var(--accent2); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
    gap: 14px;
  }
  .panel {
    background: var(--card);
    border-radius: 16px;
    padding: 16px 18px 8px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.18);
  }
  .panel h2 {
    font-size: 15px;
    margin: 0 0 10px;
    color: var(--text);
  }
  .panel.wide { grid-column: 1 / -1; }
  canvas { max-height: 420px; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    text-align: left;
    padding: 6px 8px;
    border-bottom: 1px solid #eee;
  }
  th {
    background: #f4f6fb;
    color: var(--muted);
    font-weight: 600;
    position: sticky;
    top: 0;
  }
  tr:hover td { background: #f8f9ff; }
  .table-wrap { max-height: 420px; overflow-y: auto; border-radius: 8px; }

  .search {
    width: 100%;
    padding: 9px 10px;
    margin-bottom: 10px;
    border: 1px solid #e1e4ea;
    border-radius: 8px;
    font-size: 14px;
  }
  .footer {
    text-align: center;
    color: #8892a8;
    font-size: 11px;
    margin-top: 18px;
  }

  @media (max-width: 600px) {
    body { padding: 10px; }
    h1 { font-size: 19px; }
    .kpi .value { font-size: 20px; }
    .panel { padding: 12px 12px 6px; }
  }
</style>
</head>
<body>

<h1>KCCC PRS 참여 현황 대시보드</h1>
<div class="subtitle">전체 / 지구별 / 캠퍼스별 참여 인원 한눈에 보기</div>

<div class="kpi-row" id="kpiRow"></div>

<div class="grid">
  <div class="panel wide">
    <h2>지구별 참여 인원</h2>
    <canvas id="districtChart"></canvas>
  </div>
  <div class="panel wide">
    <h2>지구별 현황 표</h2>
    <input class="search" id="districtSearch" placeholder="지구명 검색...">
    <div class="table-wrap">
      <table id="districtTable">
        <thead>
          <tr><th>지구</th><th>캠퍼스 수</th><th>인원 수</th><th>비율</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <div class="panel wide">
    <h2>캠퍼스(소그룹)별 인원</h2>
    <input class="search" id="campusSearch" placeholder="지구 또는 캠퍼스명 검색...">
    <div class="table-wrap">
      <table id="campusTable">
        <thead>
          <tr><th>지구</th><th>캠퍼스(소그룹)</th><th>인원 수</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<div class="footer">PRS 데이터 기반 자동 생성 대시보드 · 지구 정보 누락 캠퍼스는 소재지 기준으로 보완, ○○총단은 기타로 분류</div>

<script>

주지구", "campus": "진주교육대학교", "members": 10}, {"district": "창원지구", "campus": "창원지구", "members": 4}, {"district": "기타", "campus": "채움총단", "members": 8}, {"district": "용인지구", "campus": "청강문화산업대학교", "members": 12}, {"district": "청주지구", "campus": "청주대학교", "members": 99}, {"district": "목포지구", "campus": "초당대학교", "members": 2}, {"district": "서울 남팀", "campus": "총신대학교", "members": 17}, {"district": "울산지구", "campus": "춘해보건대학교", "members": 12}, {"district": "대전지구", "campus": "충남대학교", "members": 53}, {"district": "평안지구", "campus": "한경대학교", "members": 18}, {"district": "청주지구", "campus": "한국교원대학교", "members": 11}, {"district": "충주지구", "campus": "한국교통대학교", "members": 10}, {"district": "청주지구", "campus": "한국교통대학교 증평캠퍼스", "members": 21}, {"district": "공주지구", "campus": "한국영상대학교", "members": 4}, {"district": "부산지구", "campus": "한국해양대학교", "members": 38}, {"district": "대전지구", "campus": "한남대학교", "members": 10}, {"district": "서울 북중앙팀", "campus": "한성대학교", "members": 2}, {"district": "안양지구", "campus": "한세대학교", "members": 20}, {"district": "수원지구", "campus": "한신대학교", "members": 43}, {"district": "서울 동1팀", "campus": "한양대학교", "members": 56}, {"district": "안산지구", "campus": "한양대학교 ERICA", "members": 12}, {"district": "서울 동1팀", "campus": "한양여자대학교", "members": 7}, {"district": "수원지구", "campus": "협성대학교", "members": 11}, {"district": "서울 서팀", "campus": "홍익대학교", "members": 36}];

const totalMembers = DATA.reduce((s,d)=>s+d.members,0);
const totalCampus = DATA.length;
const districtSet = new Set(DATA.map(d=>d.district));

document.getElementById('kpiRow').innerHTML = `
  <div class="kpi"><div class="label">전체 참여 인원</div><div class="value">${totalMembers.toLocaleString()}명</div></div>
  <div class="kpi"><div class="label">캠퍼스(소그룹) 수</div><div class="value green">${totalCampus}</div></div>
  <div class="kpi"><div class="label">지구 수</div><div class="value orange">${districtSet.size}</div></div>
`;

// district aggregation
const districtMap = {};
DATA.forEach(d=>{
  const k = d.district;
  if(!districtMap[k]) districtMap[k] = {district:k, campusCount:0, members:0};
  districtMap[k].campusCount++;
  districtMap[k].members += d.members;
});
const districts = Object.values(districtMap).sort((a,b)=>b.members-a.members);

new Chart(document.getElementById('districtChart'), {
  type: 'bar',
  data: {
    labels: districts.map(d=>d.district),
    datasets: [{ label: '인원 수', data: districts.map(d=>d.members), backgroundColor: '#3b5bdb' }]
  },
  options: {
    indexAxis: 'y',
    responsive: true,
    plugins: { legend: { display:false } },
    scales: { x: { beginAtZero:true } }
  }
});

function renderDistrictTable(filter='') {
  const f = filter.trim().toLowerCase();
  const rows = districts
    .filter(d => !f || d.district.toLowerCase().includes(f))
    .map(d => `
      <tr>
        <td>${d.district}</td>
        <td>${d.campusCount}</td>
        <td>${d.members.toLocaleString()}</td>
        <td>${(d.members/totalMembers*100).toFixed(1)}%</td>
      </tr>
    `).join('');
  document.querySelector('#districtTable tbody').innerHTML = rows;
}
renderDistrictTable();
document.getElementById('districtSearch').addEventListener('input', e => renderDistrictTable(e.target.value));

function renderCampusTable(filter='') {
  const f = filter.trim().toLowerCase();
  const rows = DATA
    .filter(d => !f || d.district.toLowerCase().includes(f) || d.campus.toLowerCase().includes(f))
    .sort((a,b)=> b.members - a.members)
    .map(d => `
      <tr>
        <td>${d.district}</td>
        <td>${d.campus}</td>
        <td>${d.members}</td>
      </tr>
    `).join('');
  document.querySelector('#campusTable tbody').innerHTML = rows;
}
renderCampusTable();
document.getElementById('campusSearch').addEventListener('input', e => renderCampusTable(e.target.value));
</script>
</body>
</html>
