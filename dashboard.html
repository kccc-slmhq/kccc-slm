<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KCCC PRS 참여 현황 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root {
    --bg: #0f1626;
    --card: #ffffff;
    --accent: #3b5bdb;
    --accent2: #f59f00;
    --accent3: #20c997;
    --text: #1b1f29;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: linear-gradient(160deg, #0f1626 0%, #1b2942 100%);
    color: var(--text);
    padding: 24px;
  }
  h1 {
    color: #fff;
    font-size: 26px;
    margin: 0 0 4px;
  }
  .subtitle {
    color: #b9c2d6;
    font-size: 14px;
    margin-bottom: 24px;
  }
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 22px;
  }
  .kpi {
    background: var(--card);
    border-radius: 14px;
    padding: 18px 20px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.18);
  }
  .kpi .label { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .kpi .value { font-size: 28px; font-weight: 700; color: var(--accent); }
  .kpi .value.green { color: var(--accent3); }
  .kpi .value.orange { color: var(--accent2); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
    gap: 16px;
  }
  .panel {
    background: var(--card);
    border-radius: 16px;
    padding: 18px 20px 10px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.18);
  }
  .panel h2 {
    font-size: 16px;
    margin: 0 0 12px;
    color: var(--text);
  }
  .panel.wide { grid-column: 1 / -1; }
  canvas { max-height: 360px; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    text-align: left;
    padding: 6px 8px;
    border-bottom: 1px solid #eee;
  }
  th {
    background: #f4f6fb;
    color: var(--muted);
    font-weight: 600;
    position: sticky;
    top: 0;
  }
  tr:hover td { background: #f8f9ff; }
  .table-wrap { max-height: 420px; overflow-y: auto; border-radius: 8px; }
  .badge {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge.active { background: #d3f9d8; color: #2b8a3e; }
  .badge.inactive { background: #ffe3e3; color: #c92a2a; }

  .search {
    width: 100%;
    padding: 8px 10px;
    margin-bottom: 10px;
    border: 1px solid #e1e4ea;
    border-radius: 8px;
    font-size: 13px;
  }
  .footer {
    text-align: center;
    color: #8892a8;
    font-size: 12px;
    margin-top: 20px;
  }
</style>
</head>
<body>

<h1>KCCC PRS 참여 현황 대시보드</h1>
<div class="subtitle">지구 / 캠퍼스(소그룹) 별 참여 현황 한눈에 보기 · 데이터 기준: PRS 최종 시트</div>

<div class="kpi-row" id="kpiRow"></div>

<div class="grid">
  <div class="panel">
    <h2>모임 진행 여부 (참여 현황)</h2>
    <canvas id="meetingStatusChart"></canvas>
  </div>
  <div class="panel">
    <h2>모임 횟수 분포</h2>
    <canvas id="meetingCountChart"></canvas>
  </div>
  <div class="panel wide">
    <h2>지구별 멤버 수 · 모임 진행 캠퍼스 수</h2>
    <canvas id="districtChart"></canvas>
  </div>
  <div class="panel wide">
    <h2>지구별 현황 요약</h2>
    <div class="table-wrap">
      <table id="districtTable">
        <thead>

        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <div class="panel wide">
    <h2>캠퍼스(소그룹)별 상세 현황</h2>
    <input class="search" id="campusSearch" placeholder="지구 또는 캠퍼스명 검색...">
    <div class="table-wrap">
      <table id="campusTable">

        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<div class="footer">PRS 데이터 기반 자동 생성 대시보드</div>

  districtMap[k].meetings += d.meetings;

});

  data: {
    labels: Object.keys(meetingBuckets),
    datasets: [{ label: '캠퍼스 수', data: Object.values(meetingBuckets), backgroundColor: '#3b5bdb' }]
  },
  options: { plugins: { legend: { display:false } }, scales: { y: { beginAtZero:true, ticks:{ stepSize:1 } } } }
});

new Chart(document.getElementById('districtChart'), {
  type: 'bar',
  data: {
    labels: districts.map(d=>d.district),
    datasets: [
      { label: '총 멤버 수', data: districts.map(d=>d.members), backgroundColor: '#3b5bdb', yAxisID: 'y' },
      { label: '모임 진행 캠퍼스 수', data: districts.map(d=>d.activeCampus), backgroundColor: '#20c997', yAxisID: 'y1' }
    ]
  },
  options: {
    responsive: true,
    interaction: { mode: 'index' },
    scales: {
      y: { type:'linear', position:'left', beginAtZero:true, title:{display:true,text:'멤버 수'} },
      y1: { type:'linear', position:'right', beginAtZero:true, grid:{drawOnChartArea:false}, title:{display:true,text:'캠퍼스 수'} }
    }
  }
});

// ---- district table ----
const dBody = document.querySelector('#districtTable tbody');
dBody.innerHTML = districts.map(d=>`
  <tr>
    <td>${d.district}</td>
    <td>${d.campusCount}</td>
    <td>${d.members.toLocaleString()}</td>
    <td>${d.activeCampus}</td>
    <td>${(d.activeCampus/d.campusCount*100).toFixed(0)}%</td>
    <td>${d.meetings}</td>
  </tr>
`).join('');

// ---- campus table ----
function renderCampusTable(filter='') {
  const f = filter.trim().toLowerCase();
  const rows = DATA
    .filter(d => !f || d.district.toLowerCase().includes(f) || d.campus.toLowerCase().includes(f))
    .sort((a,b)=> b.members - a.members)
    .map(d => `
      <tr>
        <td>${d.district}</td>
        <td>${d.campus}</td>
        <td>${d.members}</td>
        <td>${d.meetings}</td>
        <td>${d.last || '-'}</td>
        <td>${d.meetings>0 ? '<span class="badge active">진행</span>' : '<span class="badge inactive">미진행</span>'}</td>
      </tr>
    `).join('');
  document.querySelector('#campusTable tbody').innerHTML = rows;
}
renderCampusTable();
document.getElementById('campusSearch').addEventListener('input', e => renderCampusTable(e.target.value));
</script>
</body>
</html>
